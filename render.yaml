envVarGroups:
  - name: masar-startup-shared
    envVars:
      - key: PITCH_SERVICE_TOKEN
        generateValue: true

services:
  - type: web
    name: masar-startup-muhannad-web
    runtime: static
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build:web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://masar-startup-muhannad-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: masar-startup-muhannad-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    envVars:
      - key: WEB_ORIGIN
        value: https://masar-startup-muhannad-web.onrender.com
      - key: PITCH_ANALYZER_URL
        value: https://masar-startup-muhannad-analyzer.onrender.com/internal/analyze
      - fromGroup: masar-startup-shared

  - type: web
    name: masar-startup-muhannad-analyzer
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./services/pitch-analyzer/Dockerfile
    dockerContext: ./services/pitch-analyzer
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: ANALYSIS_CONCURRENCY
        value: "4"
      - key: OPENAI_AGENT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_SYNTHESIS_MODEL
        value: gpt-4.1
      - key: OPENAI_API_KEY
        sync: false
      - fromGroup: masar-startup-shared
